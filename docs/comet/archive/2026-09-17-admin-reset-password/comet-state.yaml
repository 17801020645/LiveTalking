    text: A1：管理员为活跃普通用户设新密码后，旧密码登录失败（与错误密码同一文案），新密码可以；该用户原有会话失效
    result: passed
    reason:
      text: POST /api/v1/admin/users/{id}/password 更新哈希并 DELETE 该用户全部 sessions。test_a1
        覆盖：旧密码登录 401 且 msg 为 LOGIN_ERROR（与错误密码相同），新密码可登录；预先 create_session 的
        token 已从 sessions 表删除。
      truncated: false
  - id: A2
    source: brief.md
    text: A2：已禁用用户也可改密；启用后须用新密码登录。改管理员、当前登录账号或不存在的 id 失败；未登录 401，普通用户 403；新密码少于 6
      位被拒绝且哈希不变
    result: passed
    reason:
      text: 已禁用用户改密 200，登录仍 401（LOGIN_ERROR），启用后旧密码 401、新密码 200。改当前管理员账号 400、不存在 id
        404；未登录 401、普通用户 403；密码短于 6 位 400 且原密码仍可登录（哈希未变）。role!=user
        时返回「只能给普通用户改密」。
      truncated: false
  - id: A3
    source: brief.md
    text: A3：普通用户行有改密按钮并经确认后输入新密码；管理员行没有
    result: passed
    reason:
      text: Ops.vue 普通用户行 v-if="u.role === 'user'" 显示「改密」，resetPassword 先
        window.confirm 再 window.prompt 后 POST
        {password}；管理员行无该按钮。README/README-EN 管理员说明已含改密。
      truncated: false
  - id: A4
    source: brief.md
    text: A4：原 `web/` 无改动；顶栏自己改密行为不变
    result: passed
    reason:
      text: git diff --exit-code -- web/ 通过。PasswordForm 仍走 POST
        /api/v1/auth/password（current_password/new_password），change_password
        未改；test_user_change_password 仍覆盖顶栏自己改密。
      truncated: false
