apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-agent
  namespace: nexus-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nexus-prometheus-agent
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics", "nodes/proxy", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nexus-prometheus-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nexus-prometheus-agent
subjects:
  - kind: ServiceAccount
    name: prometheus-agent
    namespace: nexus-monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-agent
  namespace: nexus-monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      external_labels:
        cluster: nexus-lab
        site: ubuntu-4090
    remote_write:
      - url: http://192.168.31.55:9090/api/v1/write
        queue_config:
          max_samples_per_send: 5000
          capacity: 10000
    scrape_configs:
      - job_name: node-exporter
        static_configs:
          - targets: ["node-exporter.nexus-monitoring.svc.cluster.local:9100"]
      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics.nexus-monitoring.svc.cluster.local:8080"]
      - job_name: dcgm-exporter
        static_configs:
          - targets: ["dcgm-exporter.nexus-monitoring.svc.cluster.local:9400"]
      - job_name: kubelet-cadvisor
        scheme: https
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: instance
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-agent
  namespace: nexus-monitoring
  labels:
    app.kubernetes.io/name: prometheus-agent
    app.kubernetes.io/part-of: nexus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus-agent
        app.kubernetes.io/part-of: nexus
    spec:
      serviceAccountName: prometheus-agent
      containers:
        - name: prometheus-agent
          image: prom/prometheus:v2.55.1
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --enable-feature=agent
            - --storage.agent.path=/prometheus
            - --web.listen-address=:9090
          ports:
            - name: http
              containerPort: 9090
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-agent
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-agent
  namespace: nexus-monitoring
  labels:
    app.kubernetes.io/name: prometheus-agent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus-agent
  ports:
    - name: http
      port: 9090
      targetPort: 9090
