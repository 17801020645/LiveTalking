apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-live
  namespace: nexus
  labels:
    app.kubernetes.io/name: nexus-live
    app.kubernetes.io/part-of: nexus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nexus-live
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexus-live
        app.kubernetes.io/part-of: nexus
    spec:
      runtimeClassName: nvidia
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
        - name: ui-assets
          image: nexus-ui:v0.6.7
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "cp -a /ui/. /app/ui_dist/"]
          volumeMounts:
            - name: ui-assets
              mountPath: /app/ui_dist
      containers:
        - name: live
          image: nexus-app:v0.6.6
          imagePullPolicy: IfNotPresent
          command: ["/app/scripts/run_live_container.sh"]
          envFrom:
            - secretRef:
                name: nexus-env
                optional: true
          env:
            - name: LIVE_PORT
              value: "8010"
            - name: MAX_SESSIONS
              value: "2"
            - name: OFFLINE_API_URL
              value: "http://nexus-offline:8012"
          ports:
            - name: https
              containerPort: 8010
          resources:
            requests:
              cpu: "1"
              memory: 6Gi
              nvidia.com/gpu: 1
            limits:
              cpu: "8"
              memory: 20Gi
              nvidia.com/gpu: 1
          startupProbe:
            tcpSocket:
              port: 8010
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 8010
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 8010
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: ui-assets
              mountPath: /app/ui_dist
              readOnly: true
            - name: data
              mountPath: /app/data
            - name: models
              mountPath: /app/models
              readOnly: true
            - name: certs
              mountPath: /app/certs
              readOnly: true
            - name: streamout
              mountPath: /app/streamout
              readOnly: true
            - name: web
              mountPath: /app/web
              readOnly: true
            - name: server-code
              mountPath: /app/server
              readOnly: true
            - name: llm-file
              mountPath: /app/llm.py
              readOnly: true
      volumes:
        - name: ui-assets
          emptyDir: {}
        - name: data
          hostPath:
            path: /data/apps/digital-human/data
            type: Directory
        - name: models
          hostPath:
            path: /data/models/weights
            type: Directory
        - name: certs
          hostPath:
            path: /home/banren45/workspace/01_digital_human/LiveTalking/.worktrees/single-node-mvp/certs
            type: Directory
        - name: streamout
          hostPath:
            path: /home/banren45/workspace/01_digital_human/LiveTalking/streamout
            type: Directory
        - name: web
          hostPath:
            path: /home/banren45/workspace/01_digital_human/LiveTalking/web
            type: Directory
        - name: server-code
          hostPath:
            path: /home/banren45/workspace/01_digital_human/LiveTalking/server
            type: Directory
        - name: llm-file
          hostPath:
            path: /home/banren45/workspace/01_digital_human/LiveTalking/llm.py
            type: File
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-live
  namespace: nexus
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: nexus-live
  ports:
    - name: https
      port: 8010
      targetPort: 8010
      nodePort: 30810
