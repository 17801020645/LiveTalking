###############################################################################
#  LiveTalking Configuration
#  CLI arguments override values in this file
###############################################################################

# -------- Audio ----------------------------------------------------------
l: 10
m: 8
r: 10

# -------- Avatar Model ----------------------------------------------------------
model: wav2lip                 # musetalk / wav2lip / ultralight
avatar_id: wav2lip_avatar_female_model
batch_size: 16

# -------- Custom Actions ----------------------------------------------------------
# 全局动作编排会覆盖所有会话的静音画面。当前 JSON 的 audiotype=1
# 指向女形象 full_imgs，连 wav2lip_yyh 时待机也会变成她。
# 需要演示动作编排时再打开，且素材必须与当前 avatar_id 同一人。
customvideo_config: ''

# -------- TTS ----------------------------------------------------------
# 默认 EdgeTTS，不依赖本机 GPU。切到本地 Omni 的步骤见 docs/omni_tts.md
tts: edgetts                   # edgetts / omnitts / gpt-sovits / cosyvoice / fishtts / tencent / doubao / indextts2 / azuretts / qwentts
REF_FILE: ''                   # voice name or reference audio file path (wav, 16kHz, mono)
REF_TEXT: ''                   # reference text for voice cloning (English or Chinese)
TTS_SERVER: ''                 # TTS server URL, no trailing slash；omnitts 示例 http://127.0.0.1:8091

# -------- LLM (Chat 模式，OpenAI 兼容接口) -----------------------------------
# 任意兼容 /v1/chat/completions 的服务。示例：
#   DashScope: 如下默认；Key 用 DASHSCOPE_API_KEY 或 LLM_API_KEY
#   OpenAI:    llm_base_url: https://api.openai.com/v1    llm_model: gpt-4o-mini
#   DeepSeek:  llm_base_url: https://api.deepseek.com/v1  llm_model: deepseek-chat
#   Ollama:    llm_base_url: http://127.0.0.1:11434/v1    llm_model: qwen2.5
#   vLLM:      llm_base_url: http://127.0.0.1:8000/v1     llm_model: <served-name>
# llm_base_url: 'https://dashscope.aliyuncs.com/compatible-mode/v1'
llm_base_url: 'https://api.deepseek.com/v1'
llm_model: deepseek-chat
llm_api_key: ''                # 不建议写入仓库；留空则读环境变量
llm_api_key_env: DEEPSEEK_API_KEY   # 其次回退 DASHSCOPE_API_KEY
llm_system_prompt: '你是一个知识助手，尽量以简短、口语化的方式输出。不要使用Markdown，不要用星号或井号强调。'
llm_stream_usage: false        # 本地 vLLM/Ollama 请保持 false

# -------- Transport ----------------------------------------------------------
transport: webrtc              # rtcpush / webrtc / rtmp / virtualcam
stun: 'stun:stun.freeswitch.org:3478'  # stun server URL
push_url: ''                   # push URL for rtcpush/rtmp (not needed for webrtc/virtualcam)
max_session: 5                 # max concurrent sessions
listenport: 8010
